version: '3.9'

services:
  # ============================================================================
  # 1. PostgreSQL with PostGIS Spatial Database
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: archai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archai_admin
      POSTGRES_PASSWORD: archai_secure_pass_2026
      POSTGRES_DB: archai_v3_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archai_admin -d archai_v3_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis Message Broker & In-Memory State Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: archai_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. MinIO S3-Compatible Object Storage & Console
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: archai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: archai_minio_access
      MINIO_ROOT_PASSWORD: archai_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 4. FastAPI Core Backend Engine (API)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: archai_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://archai_admin:archai_secure_pass_2026@postgres:5432/archai_v3_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=archai_minio_access
      - S3_SECRET_KEY=archai_minio_secret
      - S3_BUCKET=archai-studio-assets
      - ENVIRONMENT=production
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./integrations:/app/integrations
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 5. Celery Distributed Task Worker (Optimizer, Geometry & BIM)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: archai_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://archai_admin:archai_secure_pass_2026@postgres:5432/archai_v3_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=archai_minio_access
      - S3_SECRET_KEY=archai_minio_secret
      - S3_BUCKET=archai-studio-assets
      - ENVIRONMENT=production
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - ./integrations:/app/integrations

  # ============================================================================
  # 6. Next.js 14 Web Frontend
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: archai_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8000/api/v1
      - NODE_ENV=production
    ports:
      - "3000:3000"

  # ============================================================================
  # 7. Nginx Gateway & Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: archai_nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
